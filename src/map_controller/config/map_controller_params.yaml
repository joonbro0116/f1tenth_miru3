# =============================================================================
# CONSERVATIVE PARAMETERS FOR REAL VEHICLE - F1TENTH
# =============================================================================
# Date: 2025-10-08
# Purpose: Safe initial parameters for real vehicle testing
#
# Key changes from racing defaults:
# 1. LOOKAHEAD: Longer and more stable (t_clip_min: 1.2, m_l1: 0.4, q_l1: 0.2)
#    - Reduces aggressive cornering
#    - More predictable behavior
#
# 2. STEERING: Smoother and less responsive (threshold: 0.3, acc_scaler: 1.05)
#    - Prevents sudden steering changes
#    - Better for initial testing
#
# 3. SPEED: More conservative scaling (start: 5.0, end: 6.5, downscale: 0.3)
#    - Reduces speed in high-speed sections
#    - Safer cornering
#
# Testing procedure:
# 1. Start with max_speed capped in CSV (e.g., 2-3 m/s)
# 2. Verify smooth operation
# 3. Gradually increase speed limits
# 4. Fine-tune parameters based on vehicle response
# =============================================================================
