map_controller_manager:
  ros__parameters:
    csv_file_path: "/home/sh/projects/f1tenth_miru3/maps_racelines/raceline/levine_recorded.csv"

    # Conservative lookahead parameters for real vehicle safety
    t_clip_min: 1.2              # Increased from 0.8 - longer minimum lookahead for stability
    t_clip_max: 5.0              # Keep max lookahead
    m_l1: 0.4                    # Reduced from 0.6 - less aggressive speed-based lookahead
    q_l1: 0.2                    # Increased from -0.18 - add base lookahead distance

    # Speed control
    speed_lookahead: 0.3         # Increased from 0.25 - more anticipation
    lat_err_coeff: 1.2           # Increased from 1.0 - more speed reduction for lateral error

    # Conservative steering scaling (less aggressive)
    acc_scaler_for_steer: 1.05   # Reduced from 1.2 - minimal steering boost when accelerating
    dec_scaler_for_steer: 0.95   # Increased from 0.9 - less steering reduction when braking
    start_scale_speed: 5.0       # Reduced from 7.0 - start scaling at lower speed
    end_scale_speed: 6.5         # Reduced from 8.0 - conservative high-speed limit
    downscale_factor: 0.3        # Increased from 0.2 - more steering reduction at high speed

    # Steering smoothing
    speed_lookahead_for_steer: 0.1  # Increased from 0.0 - add steering delay compensation
    steering_change_threshold: 0.3  # Reduced from 0.4 - smoother steering changes

    # Lookup table (use empty string to disable and use kinematic model)
    steering_lut: ""

    # Control loop
    loop_rate_hz: 40.0
    use_sim_time: false

