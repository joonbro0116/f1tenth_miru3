/**:
  ros__parameters:
    # Waypoint file path (CSV format: x, y, speed)
    # Available files in maps_racelines_/raceline/:
    #   - 0927_speed_3.csv, 0927_speed_4.csv, 0927_speed_5.csv
    #   - jg_thursday.csv, f1tenth_korea_3rd.csv
    csv_file_path: "/home/f1/f1tenth_ws/maps_racelines_/raceline/1017_7.0.csv"

    # L1 Controller Parameters (from race_stack/forza, tuned for real car)
    # Lookahead distance clipping
    t_clip_min: 1.0      # Minimum lookahead time [s] (conservative for real car)
    t_clip_max: 2.0      # Maximum lookahead time [s] (increased for stability)

    # L1 lookahead calculation: L1 = q_l1 + m_l1 * speed
    m_l1: 0.6            # Lookahead slope (adaptive to speed)
    q_l1: 0.0            # Lookahead offset (increased for real car safety)

    # Speed lookahead for delay compensation
    speed_lookahead: 0.25              # Time lookahead for speed selection [s]
    speed_lookahead_for_steer: 0.0     # Time lookahead for steering calculation [s]

    # Lateral error speed reduction
    lat_err_coeff: 1.0   # Coefficient for speed reduction based on lateral error [0-1]

    # Steering scaling based on acceleration
    acc_scaler_for_steer: 1.2   # Increase steering when accelerating
    dec_scaler_for_steer: 0.9   # Decrease steering when braking

    # Steering scaling based on speed
    start_scale_speed: 7.0     # Speed where steering starts to scale down [m/s]
    end_scale_speed: 8.0       # Speed where steering is fully scaled [m/s]
    downscale_factor: 0.2      # Maximum steering reduction factor at high speed

    # Steering lookup table
    # Options: 'NUC1_pacejka', 'NUC2_pacejka', '' (empty for kinematic fallback)
    steering_lut: "NUC2_pacejka"

    # REAL CAR: Use TF for real-time localization (like pure_pursuit)
    use_tf_for_localization: true  # TF (map->base_link) for real-time pose
    tf_timeout: 0.1                 # TF lookup timeout (seconds)
    max_pose_age: 0.5               # Max age for fallback AMCL pose (seconds)

    # Legacy fallback (if TF fails)
    use_odom_pose: false            # Fallback: use odom pose (SIM)
    use_amcl_pose: false            # Fallback: use AMCL topic

    # Control loop rate
    loop_rate_hz: 40.0
